<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Scanner</title>
<style>
  :root { --green:#25d366; --dark:#075e54; --bg:#f4f6f8; --ink:#1b2430; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--dark); color:#fff; padding:14px 16px; font-weight:600; font-size:18px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .actions { display:flex; gap:10px; }
  .btn { flex:1; text-align:center; padding:14px; border-radius:12px; border:0;
         font-size:16px; font-weight:600; cursor:pointer; }
  .btn.primary { background:var(--green); color:#073b2c; }
  .btn.secondary { background:#fff; color:var(--ink); border:1px solid #cfd6dd; }
  input[type=file] { display:none; }
  #status { margin:14px 2px; min-height:22px; color:#516070; font-size:15px; }
  #stage { position:relative; display:none; border-radius:12px; overflow:hidden;
           box-shadow:0 2px 10px rgba(0,0,0,.15); background:#000; }
  #stage img { display:block; width:100%; height:auto; }
  .hit { position:absolute; border:2px solid var(--green); background:rgba(37,211,102,.22);
         border-radius:6px; cursor:pointer; padding:0; }
  .hit.selected { border-color:#ff9800; background:rgba(255,152,0,.35);
                  box-shadow:0 0 0 3px rgba(255,152,0,.5); }
  #bar { position:sticky; bottom:0; margin-top:14px; display:none; background:#fff;
         border-radius:12px; padding:12px 14px; box-shadow:0 -2px 12px rgba(0,0,0,.12); }
  #bar .num { font-size:20px; font-weight:700; }
  #bar .hint { color:#516070; font-size:14px; margin:2px 0 10px; }
  #open { width:100%; background:var(--green); color:#073b2c; }
  ul#list { list-style:none; padding:0; margin:14px 0 0; }
  ul#list li { background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:8px;
               display:flex; justify-content:space-between; align-items:center;
               border:2px solid transparent; cursor:pointer; font-size:17px; }
  ul#list li.selected { border-color:#ff9800; background:#fff7ea; }
  ul#list li small { color:#516070; }
</style>
</head>
<body>
<header>📇 Card Scanner → WhatsApp</header>
<main>
  <div class="actions">
    <label class="btn primary" for="cam">📷 Scan card</label>
    <label class="btn secondary" for="gal">🖼 Gallery</label>
  </div>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <input id="gal" type="file" accept="image/*">

  <div id="status">Take a photo of the card, or pick one from your gallery.</div>

  <div id="stage"><img id="photo" alt="Scanned card"></div>

  <ul id="list"></ul>

  <div id="bar">
    <div class="num" id="barNum"></div>
    <div class="hint">Tap the number again (or the button) to open WhatsApp</div>
    <button class="btn" id="open">Open in WhatsApp</button>
  </div>
</main>

<script>
const MESSAGE = {{ message|tojson }};
const $ = id => document.getElementById(id);
let numbers = [], selected = null;

function waLink(n) {
  return "https://wa.me/" + n.wa + "?text=" + encodeURIComponent(MESSAGE);
}
function openWA(n) { window.location.href = waLink(n); }

// Single tap selects, second tap on the same number opens WhatsApp.
function tapNumber(i) {
  if (selected === i) { openWA(numbers[i]); return; }
  selected = i;
  render();
}

function render() {
  document.querySelectorAll(".hit").forEach(el =>
    el.classList.toggle("selected", +el.dataset.i === selected));
  const list = $("list");
  list.innerHTML = "";
  numbers.forEach((n, i) => {
    const li = document.createElement("li");
    li.className = i === selected ? "selected" : "";
    li.innerHTML = `<span>${n.display}</span><small>${i === selected ? "tap again → WhatsApp" : "tap to select"}</small>`;
    li.onclick = () => tapNumber(i);
    list.appendChild(li);
  });
  $("bar").style.display = selected === null ? "none" : "block";
  if (selected !== null) $("barNum").textContent = numbers[selected].display;
}

function drawBoxes() {
  document.querySelectorAll(".hit").forEach(e => e.remove());
  numbers.forEach((n, i) => {
    const b = document.createElement("button");
    b.className = "hit"; b.dataset.i = i;
    b.style.left = n.x * 100 + "%";  b.style.top = n.y * 100 + "%";
    b.style.width = n.w * 100 + "%"; b.style.height = n.h * 100 + "%";
    b.setAttribute("aria-label", n.display);
    b.onclick = () => tapNumber(i);
    $("stage").appendChild(b);
  });
}

// Resize in the browser (also bakes in EXIF rotation) so boxes line up with what is shown.
async function toJpeg(file, maxSide = 2000) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
  return { blob, url: c.toDataURL("image/jpeg", 0.9) };
}

async function handle(file) {
  if (!file) return;
  selected = null; numbers = []; render();
  $("status").textContent = "Reading card…";
  try {
    const { blob, url } = await toJpeg(file);
    $("photo").src = url;
    $("stage").style.display = "block";
    drawBoxes();
    const fd = new FormData(); fd.append("image", blob, "card.jpg");
    const res = await fetch("/api/scan", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Scan failed");
    numbers = data.numbers;
    drawBoxes(); render();
    $("status").textContent = numbers.length
      ? `Found ${numbers.length} number${numbers.length > 1 ? "s" : ""}. Tap one to select it.`
      : "No phone number found. Try a sharper, well-lit photo.";
  } catch (e) {
    $("status").textContent = "Error: " + e.message;
  }
}

$("cam").onchange = e => { handle(e.target.files[0]); e.target.value = ""; };
$("gal").onchange = e => { handle(e.target.files[0]); e.target.value = ""; };
$("open").onclick = () => { if (selected !== null) openWA(numbers[selected]); };
</script>
</body>
</html>
